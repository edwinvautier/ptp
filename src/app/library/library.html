<section class="library">
  <h1 class="sr-only">Collection</h1>
  @if (photos().length === 0) {
    <p class="empty">Aucune photo pour l'instant. Swipe à droite pour en acheter.</p>
  } @else {
    <ul>
      @for (photo of photos(); track photo.id; let i = $index) {
        <li>
          <button
            type="button"
            (click)="open(photo, $event)"
            aria-label="Agrandir la photo"
            [class.is-glow]="glowing(i)"
          >
            <span class="thumb">
              <img [ngSrc]="photo.src" fill disableOptimizedSrcset alt="" [priority]="i < 2" />
            </span>
          </button>
        </li>
      }
    </ul>
  }
</section>

@if (selected(); as photo) {
  <div
    class="lightbox"
    role="dialog"
    aria-modal="true"
    aria-labelledby="lightbox-title"
    (click)="close()"
    (keydown)="onDialogKeydown($event)"
  >
    <h2 id="lightbox-title" class="sr-only">Photo achetée</h2>
    <div class="frame" (click)="$event.stopPropagation()">
      <img [ngSrc]="photo.src" fill priority disableOptimizedSrcset alt="Photo de pied achetée" />
    </div>
    <button #candleButton type="button" class="candle" (click)="openCandle($event)">
      Acheter une bougie parfumée
    </button>
    <button #closeButton type="button" (click)="close(); $event.stopPropagation()">Fermer</button>
  </div>
}

@if (candle()) {
  <button
    #weirdButton
    type="button"
    class="weird"
    (click)="closeCandle()"
    (keydown)="onWeirdKeydown($event)"
  >
    T'es bizarre un peu non ?
  </button>
}
